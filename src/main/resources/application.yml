server:
  port: ${PORT:8080}
  # Railway 같은 HTTPS 프록시 뒤에서 Swagger가 https 주소로 호출하도록 X-Forwarded-* 헤더를 반영
  forward-headers-strategy: framework

spring:
  application:
    name: hackathon
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # 프로젝트 루트의 .env(git 제외)를 읽음. 없으면 무시. 배포 환경에서는 환경변수가 우선
  config:
    import: optional:file:./.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5-5}
  # low / medium / high. 데모 응답 속도가 느리면 low 유지
  effort: ${ANTHROPIC_EFFORT:low}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:hackathon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      # 기본은 꺼 둔다. 로컬에서 DB를 들여다볼 때만 H2_CONSOLE_ENABLED=true 로 켠다 (공개 주소에서 열리면 안 됨)
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
