<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 스쿼트 추적 시험</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; max-width: 760px; margin: 16px auto; padding: 0 12px; color: #111; }
  h1 { font-size: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  button, input[type=file] { font-size: 15px; padding: 8px; }
  #stage { position: relative; background: #000; min-height: 200px; }
  #video, #overlay { width: 100%; display: block; }
  #overlay { position: absolute; left: 0; top: 0; height: 100%; }
  #count { font-size: 56px; font-weight: 700; line-height: 1; }
  .stat { font-size: 14px; color: #444; }
  #cue { font-size: 18px; font-weight: 600; min-height: 26px; color: #b45309; }
  table { border-collapse: collapse; font-size: 13px; margin-top: 8px; width: 100%; }
  td, th { border: 1px solid #ddd; padding: 4px 6px; text-align: right; }
  td:last-child, th:last-child { text-align: left; }
  .muted { color: #666; font-size: 13px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
</style>
</head>
<body>
<h1>실시간 스쿼트 추적 시험 페이지</h1>
<p class="muted">MediaPipe가 브라우저 안에서 관절을 추적합니다. 영상은 서버로 보내지 않습니다. 휴대폰을 세워 두고 2~3m 떨어져 전신이 보이게 서세요. 옆에서 찍으면 깊이와 상체 기울기를, 정면에서 찍으면 무릎 모임과 좌우 쏠림을 봅니다.</p>

<div class="row">
  <button id="camera" type="button">카메라로 시작</button>
  <label>또는 영상 파일 <input id="file" type="file" accept="video/*"></label>
  <label><input id="voice" type="checkbox" checked> 음성 안내</label>
  <button id="stop" type="button">정지</button>
</div>

<div id="stage"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>

<div class="row">
  <div><div id="count">0</div><div class="stat">횟수</div></div>
  <div>
    <div id="cue"></div>
    <div class="stat" id="status">모델을 불러오는 중...</div>
    <div class="stat" id="live"></div>
  </div>
</div>

<table>
  <thead><tr><th>회</th><th>방향</th><th>깊이</th><th>시간</th><th>상체 기울기</th><th>무릎/발목 간격</th><th>관찰</th></tr></thead>
  <tbody id="reps"></tbody>
</table>

<div class="row">
  <button id="save" type="button" disabled>세트 저장하고 AI 설명 받기</button>
  <span class="muted">근전도는 센서가 없어 시뮬레이션 값을 함께 보냅니다.</span>
</div>
<div id="setResult"></div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

// ── 기준값. 전부 "엉덩이 높이 비율"(서 있을 때 1)과 화면상 각도로 정한다 ──────────────────
// 횟수는 무릎 각도가 아니라 엉덩이 높이로 센다. 무릎 각도는 정면에서 찍으면 거의 변하지 않기 때문이다.
const REP_START = 0.90;     // 엉덩이가 서 있을 때의 90% 아래로 내려오면 한 번이 시작
const REP_END = 0.93;       // 93% 위로 돌아오면 한 번이 끝
const REP_COUNTED = 0.80;   // 최저점이 80% 아래여야 횟수로 센다 (그 위는 "얕은 시도")
const MIN_VISIBILITY = 0.5;
const FRONT_VIEW_RATIO = 0.45;  // 어깨 너비 / 몸통 길이가 이보다 크면 정면으로 본다
// 허리를 숙여 물건을 집는 동작은 엉덩이가 내려가도 스쿼트가 아니다. 측면에서는 상체가 크게 접히는지로 걸러낸다.
// 공개 데이터 20명의 실제 스쿼트 100회에서 상체 기울기 최댓값은 50도였고, 숙이는 동작은 79~82도였다.
// 정면에서는 걸러내지 않는다. 몸통이 짧아 보이는 정도로 구분하려 했더니 실제 스쿼트 80회 중 7회를 버렸다.
const BEND_LEAN = 65;       // 측면: 상체가 65도 넘게 기울고
const BEND_THIGH = 30;      //       허벅지는 수평보다 30도 넘게 서 있으면 숙이기
// 관찰 기준
const SHALLOW_THIGH = 15;   // 측면: 최저점에서 허벅지가 수평보다 15도 넘게 위면 "깊이 부족"
const LEAN_LIMIT = 50;      // 측면: 상체가 수직에서 50도 넘게 기울면 "상체 숙임 큼"
const KNEE_IN_RATIO = 0.80; // 정면: 최저점 무릎 간격이 발목 간격의 80% 미만이면 "무릎 안쪽 모임"
const SHIFT_LIMIT = 0.25;   // 정면: 골반 중심이 발 중심에서 발 간격의 25% 넘게 벗어나면 "좌우 쏠림". 카메라가 비스듬하면 오탐이 난다

const $ = id => document.getElementById(id);
const video = $('video');
const canvas = $('overlay');
const ctx = canvas.getContext('2d');
const drawing = new DrawingUtils(ctx);

let landmarker = null;
let running = false;
let onDone = null;
let lastVideoTime = -1;
let t = null;            // 추적 상태
const reps = [];
const partials = [];     // 얕아서 세지 않은 시도
const ignored = [];      // 스쿼트가 아니라고 보고 버린 동작 (허리 숙이기)
const series = [];       // 검증용: [영상 시각, 엉덩이 높이 비율, 추론 ms]
const times = [];
window.poseTest = { reps, partials, ignored, series };

function newTracker() {
  return { standing: 0, standingTorso: 0, smooth: null, phase: 'up', min: 1, bottom: null, maxLean: 0, minTorso: 1, start: 0, views: [] };
}

// 화면 좌표(픽셀)로 바꾼 관절에서 한 프레임의 측정값을 만든다
function measure(lm) {
  const w = video.videoWidth, h = video.videoHeight;
  const p = i => ({ x: lm[i].x * w, y: lm[i].y * h, v: lm[i].visibility });
  const L = { shoulder: p(11), hip: p(23), knee: p(25), ankle: p(27) };
  const R = { shoulder: p(12), hip: p(24), knee: p(26), ankle: p(28) };
  const vis = s => Math.min(s.hip.v, s.knee.v, s.ankle.v);
  if (Math.max(vis(L), vis(R)) < MIN_VISIBILITY) return null;

  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const hip = mid(L.hip, R.hip), ankle = mid(L.ankle, R.ankle), shoulder = mid(L.shoulder, R.shoulder);
  const torso = Math.hypot(shoulder.x - hip.x, shoulder.y - hip.y) || 1;
  const front = Math.abs(L.shoulder.x - R.shoulder.x) / torso > FRONT_VIEW_RATIO;
  const near = vis(L) >= vis(R) ? L : R;   // 측면에서는 카메라 쪽 다리를 쓴다

  const deg = r => r * 180 / Math.PI;
  const out = {
    front,
    legHeight: ankle.y - hip.y,                                   // 엉덩이가 발목보다 얼마나 위에 있나
    torso,
    lean: deg(Math.atan2(Math.abs(shoulder.x - hip.x), Math.abs(hip.y - shoulder.y))),
    thigh: deg(Math.atan2(near.knee.y - near.hip.y, Math.abs(near.knee.x - near.hip.x))), // 서면 90, 수평이면 0
    kneeRatio: null, shift: null,
  };
  const ankleGap = Math.abs(L.ankle.x - R.ankle.x);
  if (front && ankleGap > torso * 0.15) {
    out.kneeRatio = Math.abs(L.knee.x - R.knee.x) / ankleGap;
    out.shift = (hip.x - ankle.x) / ankleGap;
  }
  return out;
}

function findings(rep) {
  const f = [];
  if (rep.view === 'side') {
    if (rep.thighAngle > SHALLOW_THIGH) f.push('깊이 부족');
    if (rep.maxLean > LEAN_LIMIT) f.push('상체 숙임 큼');
  } else {
    if (rep.kneeRatio != null && rep.kneeRatio < KNEE_IN_RATIO) f.push('무릎 안쪽 모임');
    if (rep.shift != null && Math.abs(rep.shift) > SHIFT_LIMIT) f.push(rep.shift > 0 ? '화면 오른쪽으로 쏠림' : '화면 왼쪽으로 쏠림');
  }
  return f;
}

const CUES = {
  '깊이 부족': '조금 더 깊이 앉아 보세요',
  '상체 숙임 큼': '가슴을 펴고 상체를 세우세요',
  '무릎 안쪽 모임': '무릎을 바깥으로 밀어 주세요',
};

function say(text) {
  $('cue').textContent = text;
  if (!$('voice').checked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 1.1;
  speechSynthesis.speak(u);
}

function addRep(rep) {
  reps.push(rep);
  $('count').textContent = reps.length;
  const tr = document.createElement('tr');
  [reps.length, rep.view === 'side' ? '측면' : '정면', Math.round(rep.depth * 100) + '%',
    (rep.durationMs / 1000).toFixed(1) + '초', Math.round(rep.maxLean) + '°',
    rep.kneeRatio == null ? '-' : rep.kneeRatio.toFixed(2), rep.findings.join(', ') || '없음']
    .forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.append(td); });
  $('reps').append(tr);
  const cue = rep.findings.map(f => CUES[f]).find(Boolean);
  say(cue ? reps.length + '. ' + cue : String(reps.length));
}

function update(m, now) {
  // 서 있을 때의 엉덩이 높이를 기준으로 삼는다. 조금씩 낮춰 가며 최댓값을 따라가 카메라 거리 변화에 적응한다
  t.standing = Math.max(t.standing * 0.999, m.legHeight);
  t.standingTorso = Math.max(t.standingTorso * 0.999, m.torso);
  const torsoRatio = m.torso / t.standingTorso;
  const ratio = m.legHeight / t.standing;
  t.smooth = t.smooth == null ? ratio : t.smooth * 0.6 + ratio * 0.4;
  if (t.phase === 'up') {
    if (t.smooth < REP_START) { t.phase = 'moving'; t.min = t.smooth; t.bottom = m; t.maxLean = m.lean; t.minTorso = torsoRatio; t.start = now; t.views = []; }
    return t.smooth;
  }
  t.views.push(m.front);
  t.maxLean = Math.max(t.maxLean, m.lean);
  t.minTorso = Math.min(t.minTorso, torsoRatio);
  if (t.smooth < t.min) { t.min = t.smooth; t.bottom = m; }
  if (t.smooth > REP_END) {
    const front = t.views.filter(Boolean).length > t.views.length / 2;
    const rep = {
      view: front ? 'front' : 'side', depth: +t.min.toFixed(3), durationMs: Math.round(now - t.start),
      maxLean: +t.maxLean.toFixed(1), thighAngle: +t.bottom.thigh.toFixed(1),
      kneeRatio: t.bottom.kneeRatio == null ? null : +t.bottom.kneeRatio.toFixed(3),
      shift: t.bottom.shift == null ? null : +t.bottom.shift.toFixed(3),
      minTorso: +t.minTorso.toFixed(3),
    };
    rep.findings = findings(rep);
    const bend = !front && rep.maxLean > BEND_LEAN && rep.thighAngle > BEND_THIGH;
    if (bend) ignored.push(rep);
    else if (t.min <= REP_COUNTED) addRep(rep);
    else { partials.push(rep); say('더 깊이 앉아 보세요'); }
    t.phase = 'up';
    t.min = 1;
  }
  return t.smooth;
}

function frame() {
  if (!running) return;
  if (video.readyState >= 2 && video.videoWidth && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    const now = performance.now();
    const result = landmarker.detectForVideo(video, now);
    const took = performance.now() - now;
    times.push(took);
    if (times.length > 30) times.shift();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let ratio = null;
    const lm = result.landmarks[0];
    if (!lm) {
      $('live').textContent = '사람을 찾지 못했습니다';
    } else {
      drawing.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: '#22c55e', lineWidth: 3 });
      drawing.drawLandmarks(lm, { color: '#ffffff', radius: 3 });
      const m = measure(lm);
      if (!m) {
        $('live').textContent = '다리가 가려졌습니다. 전신이 보이게 해 주세요';
      } else {
        // 영상 파일은 영상 시각을, 카메라는 실제 시각을 쓴다. 빨리 감기로 시험해도 반복 시간이 맞게 나온다
        ratio = update(m, video.srcObject ? now : video.currentTime * 1000);
        const avg = times.reduce((s, v) => s + v, 0) / times.length;
        $('live').textContent = (m.front ? '정면' : '측면') + ' · 엉덩이 높이 ' + Math.round(ratio * 100)
          + '% · 상체 기울기 ' + Math.round(m.lean) + '° · 추론 ' + avg.toFixed(1) + 'ms';
      }
    }
    series.push([+video.currentTime.toFixed(2), ratio == null ? null : +ratio.toFixed(3), +took.toFixed(1)]);
  }
  if (video.ended) { stop('영상이 끝났습니다'); return; }
  requestAnimationFrame(frame);
}

function reset() {
  t = newTracker();
  reps.length = 0; partials.length = 0; ignored.length = 0; series.length = 0; times.length = 0; lastVideoTime = -1;
  $('count').textContent = '0'; $('reps').replaceChildren(); $('cue').textContent = '';
}

async function start(setSource) {
  if (!landmarker) { $('status').textContent = '모델이 아직 준비되지 않았습니다'; return; }
  stop();
  reset();
  try {
    await setSource();
    await video.play();
    running = true;
    $('status').textContent = '추적 중';
    requestAnimationFrame(frame);
  } catch (e) {
    $('status').textContent = '시작 실패: ' + e.message;
    if (onDone) { const done = onDone; onDone = null; done({ error: e.message }); }
  }
}

function stop(message) {
  running = false;
  if (video.srcObject) { video.srcObject.getTracks().forEach(tr => tr.stop()); video.srcObject = null; }
  if (message) $('status').textContent = message + ' · 총 ' + reps.length + '회';
  $('save').disabled = reps.length === 0;
  if (onDone && message) {
    const done = onDone; onDone = null;
    const detected = series.filter(r => r[1] != null).length;
    done({ reps: reps.map(r => ({ ...r })), partials: partials.map(r => ({ ...r })), ignored: ignored.map(r => ({ ...r })), frames: series.length,
      detectedPct: series.length ? Math.round(detected / series.length * 100) : 0 });
  }
}

// 검증용: 영상 주소 하나를 끝까지 돌리고 결과를 돌려준다. rate로 빨리 감을 수 있다
window.poseTest.run = (url, rate = 1) => new Promise(resolve => {
  onDone = resolve;
  start(async () => {
    const blob = await (await fetch(url)).blob();
    const type = blob.type && blob.type !== 'application/octet-stream' ? blob.type : 'video/mp4';
    video.src = URL.createObjectURL(new Blob([blob], { type }));
    video.playbackRate = rate;
  });
});

$('camera').addEventListener('click', () => start(async () => {
  video.removeAttribute('src');
  video.playbackRate = 1;
  video.srcObject = await navigator.mediaDevices.getUserMedia(
    { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
}));
$('file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) start(async () => { video.playbackRate = 1; video.src = URL.createObjectURL(file); });
});
$('stop').addEventListener('click', () => { video.pause(); stop('정지했습니다'); });

// ── 세트 저장과 AI 설명 ─────────────────────────────────────────────────────────────
// 센서가 없어 근전도는 시뮬레이션한다. 깊이 앉을수록, 뒤로 갈수록 값이 커지게 만든 가짜 값이고 실제 근육 상태와 무관하다
function simulateEmg(list) {
  const channel = (name, side, gain) => ({ name, side,
    rmsPerRep: list.map((r, i) => +(gain * (1.1 - r.depth) * (1 + 0.02 * i)).toFixed(3)) });
  return [channel('대둔근', 'left', 0.42), channel('대둔근', 'right', 0.50),
          channel('대퇴사두근', 'left', 0.80), channel('대퇴사두근', 'right', 0.82)];
}

function card(title, lines) {
  const box = document.createElement('div');
  box.className = 'card';
  const head = document.createElement('strong');
  head.textContent = title;
  box.append(head);
  lines.filter(Boolean).forEach(text => { const d = document.createElement('div'); d.textContent = text; box.append(d); });
  return box;
}

function renderSet(set) {
  const st = set.stats;
  const out = [card('세트 통계 (서버 계산)', [
    st.repCount + '회 · 평균 깊이 ' + Math.round(st.avgDepth * 100) + '% (낮을수록 깊음)',
    '후반 깊이 변화 ' + Math.round(st.depthChange * 100) + '%p · 후반 속도 변화 ' + Math.round(st.tempoChangePct) + '%',
    st.fadeFromRep ? st.fadeFromRep + '회째부터 깊이나 속도가 무너졌습니다' : '끝까지 일정했습니다',
  ])];
  if (set.emg) {
    out.push(card('근전도 요약 (시뮬레이션)', [
      set.emg.targetSharePct == null ? null : '목표 근육 비중 ' + set.emg.targetSharePct + '%',
      ...set.emg.asymmetries.map(a => a.muscle + ' 좌우 차이 ' + a.diffPct + '% (' + (a.stronger === 'right' ? '오른쪽' : '왼쪽') + '이 큼)'),
    ]));
  }
  if (set.feedback) {
    out.push(card('AI 설명', [set.feedback.summary]));
    set.feedback.observations.forEach(o => out.push(card(o.title, [o.evidence, o.possibleLoad])));
    out.push(card('다음 세트에서', set.feedback.suggestions.map(x => '· ' + x)));
  } else {
    out.push(card('AI 설명', ['작성 중... (3~12초)']));
  }
  $('setResult').replaceChildren(...out);
}

// 주소에 ?user=7 처럼 붙이면 그 유저로 저장한다. 없으면 시연 데이터가 든 유저 1
const USER_ID = new URLSearchParams(location.search).get('user') || '1';

async function call(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-User-Id': USER_ID },
    body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.code + ' ' + data.message);
  return data.data;
}

$('save').addEventListener('click', async () => {
  if (!reps.length) return;
  $('save').disabled = true;
  try {
    const saved = await call('/api/sets', { exercise: '스쿼트', reps, targetMuscle: '대둔근',
      muscles: simulateEmg(reps), emgSimulated: true });
    renderSet(saved);
    const explained = await call('/api/sets/' + saved.id + '/feedback');
    renderSet(explained);
    say(explained.feedback.summary);
  } catch (e) {
    $('setResult').append(card('실패', [e.message]));
  } finally {
    $('save').disabled = false;
  }
});

try {
  const vision = await FilesetResolver.forVisionTasks(WASM);
  landmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' },
    runningMode: 'VIDEO',
    numPoses: 1,
  });
  // 첫 추론은 셰이더 준비 때문에 1초쯤 걸린다. 빈 화면으로 미리 돌려 두어 운동 시작 순간에 끊기지 않게 한다
  const warm = document.createElement('canvas');
  warm.width = 256; warm.height = 256;
  warm.getContext('2d').fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3; i++) landmarker.detectForVideo(warm, performance.now());
  $('status').textContent = '준비됨. 카메라로 시작하거나 영상 파일을 고르세요';
  window.poseTest.ready = true;
} catch (e) {
  $('status').textContent = '모델을 불러오지 못했습니다: ' + e.message;
}
</script>
</body>
</html>
